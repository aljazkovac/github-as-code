name: OpenTofu GitOps

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
  workflow_dispatch:

concurrency:
  group: opentofu-state
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
  TF_VAR_state_encryption_passphrase: ${{ secrets.TF_VAR_state_encryption_passphrase }}

jobs:
  opentofu:
    name: "OpenTofu Plan & Apply"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check if GH_PAT secret is configured
        id: check_pat
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::notice title=GH_PAT Not Configured::Skipping cloud OpenTofu run because the GH_PAT repository secret is not set yet. See TODO.md."
            echo "pat_configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "pat_configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_pat.outputs.pat_configured == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup OpenTofu
        if: steps.check_pat.outputs.pat_configured == 'true'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "latest"

      - name: OpenTofu Format Check
        if: steps.check_pat.outputs.pat_configured == 'true'
        run: tofu fmt -check

      - name: OpenTofu Init
        if: steps.check_pat.outputs.pat_configured == 'true'
        run: tofu init -input=false

      - name: OpenTofu Validate
        if: steps.check_pat.outputs.pat_configured == 'true'
        run: tofu validate

      - name: OpenTofu Plan
        if: steps.check_pat.outputs.pat_configured == 'true'
        id: plan
        run: |
          tofu plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt

      - name: Post Plan Comment on Pull Request
        if: steps.check_pat.outputs.pat_configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncatedPlan = plan.length > maxLen ? plan.substring(0, maxLen) + '\n... (truncated)' : plan;
            const body = `### OpenTofu Plan Output (\`${{ github.head_ref }}\`)\n\n\`\`\`hcl\n${truncatedPlan}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes('### OpenTofu Plan Output'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: OpenTofu Apply
        if: steps.check_pat.outputs.pat_configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tofu apply -input=false -auto-approve tfplan

      - name: Commit Updated Encrypted State
        if: steps.check_pat.outputs.pat_configured == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet terraform.tfstate; then
            git add terraform.tfstate
            git commit -m "chore(state): update encrypted OpenTofu state [skip ci]"
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi
